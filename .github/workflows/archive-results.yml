name: Archive Encrypted Student Results

on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch and merge encrypted envelopes
        run: |
          node -e '
          const fs = require("fs");
          (async () => {
            const path = "sonuclar/arsiv.json";
            const existing = fs.existsSync(path) ? JSON.parse(fs.readFileSync(path, "utf8")) : [];
            const map = new Map();
            for (const item of existing) {
              if (item && item.id) map.set(item.id, item);
            }
            const beforeJson = JSON.stringify([...map.values()]);
            const res = await fetch("https://ntfy.sh/bk_yz_kelime_d66d35030735aef792c8/json?poll=1&since=all");
            if (!res.ok) throw new Error("HTTP " + res.status);
            const text = await res.text();
            for (const line of text.split("\n")) {
              if (!line.trim()) continue;
              try {
                const outer = JSON.parse(line);
                if (outer.event && outer.event !== "message") continue;
                const env = outer.message ? JSON.parse(outer.message) : outer;
                if (!env || !env.id || (!env.ct && !env.b64)) continue;
                env._srvTime = outer.time ? outer.time * 1000 : (env._srvTime || Date.now());
                const prev = map.get(env.id);
                if (!prev || env._srvTime >= (prev._srvTime || 0)) {
                  map.set(env.id, env);
                }
              } catch (_) {}
            }
            const merged = [...map.values()];
            const afterJson = JSON.stringify(merged);
            if (beforeJson !== afterJson) {
              fs.writeFileSync(path, JSON.stringify(merged, null, 2) + "\n");
              console.log("Updated archive with", merged.length, "records.");
            } else {
              console.log("No new submissions to archive.");
            }
          })();
          '

      - name: Commit updated archive if changed
        run: |
          if git diff --quiet sonuclar/arsiv.json; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sonuclar/arsiv.json
          git commit -m "chore: archive encrypted student submissions"
          git push
